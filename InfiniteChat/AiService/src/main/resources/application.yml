spring:
  application:
    name: AiService
  profiles:
    active: dev
  mail:
    host: smtp.qq.com
    port: 587
    username: <邮箱>
    password: <授权码>
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8105
  servlet:
    context-path: /api

logging:
  level:
    dev.langchain4j.mcp: ERROR


langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-max
        api-key: <Key>
      streaming-chat-model:
        model-name: qwen-max
        api-key: <Key>
      embedding-model:
        model-name: text-embedding-v4
        api-key: <Key>


bigmodel:
  api-key: <Key>


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always